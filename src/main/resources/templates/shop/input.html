<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<title>商品画面</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
	<meta charset="UTF-8">
</head>

<body>
	<div>[[${userData.userName}]]さん、ようこそ。</div>
	<div><a th:href="@{/shop/menu}">メニューへ</a></div><br>
	<div><a th:href="@{/shop/itemList}">商品一覧へ</a></div>
	<br><br>
	<div>個数を指定して確認ボタンを押してください</div>
	<br>
	<table>
		<tr>
			<th>ジャンル</th>
			<th>商品名</th>
			<th>価格</th>
			<th>在庫</th>
		</tr>
		<tr>
			<td><span th:text="${genre}"></span></td>
			<td><span th:text="${itemName}"></span></td>
			<td><span th:text="${price}"></span></td>
			<td><span th:text="${stock}"></span></td>
		</tr>

	</table>
	<br>
	<div>商品詳細：<span th:text="${info}"></span></div><br>
	<form th:action="@{/shop/input}" th:object="${inputRequest}" th:method="POST">
		<div>
			<p>購入個数：<input type="number" name="num" value="0"/></p>
			<input type="hidden"name="itemId"th:value="${itemId}">
			<input type="submit" value="確認">
		</div>
		<div th:if="${message}">
			<div>
				<font color=red>[[${message}]]</font>
			</div>
		</div>
	</form>
	<br>
</body>

</html>
